services:
  db:
    build:
      context: ./backend.dal
      dockerfile: Dockerfile
    ports:
      - "4040:4040"
    volumes:
      - alfred_pgdata:/var/lib/postgresql

  api:
    build: .
    depends_on:
      - db
    ports:
      - "5050:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AppConfig__UseHttpsRedirection: "false"
    profiles:
      - full

volumes:
  alfred_pgdata:
