# ASP.NET Core
# Build and test ASP.NET Core projects targeting .NET Core.
# Add steps that run tests, create a NuGet package, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: 'Release'

steps:
- script: dotnet user-secrets set "DALConfig:DBPassword" "$(DB_PASSWORD)" --project backend.api && dotnet user-secrets set "JwtConfig:Key" "$(JWT_KEY)" --project backend.api
  displayName: "Creating secrets."
- script: dotnet build "Backend.slnx" --configuration $(buildConfiguration)
  displayName: 'dotnet build $(buildConfiguration)'
