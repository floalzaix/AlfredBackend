# CI for Alfred backend. No secrets in this file.
# PR validation: Branch policies (not pr:). PRs never deploy.

parameters:
  - name: deploy
    type: boolean
    default: false

trigger:
  branches:
    include:
      - prod

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  solution: backend.sln
  apiProject: backend.api/backend.api.csproj
  # Fill when you enable deploy (Project settings > Service connections).
  azureServiceConnection: REMPLACER_CONNEXION_SERVICE
  azureWebAppName: REMPLACER_NOM_APP_SERVICE

stages:
  - stage: CI
    jobs:
      - job: build
        steps:
          - task: UseDotNet@2
            displayName: .NET 10
            inputs:
              packageType: sdk
              version: 10.0.x

          - script: dotnet restore $(solution)
            displayName: Restore

          # Local fix: dotnet format whitespace $(solution) --no-restore --exclude backend.dal/Migrations
          - script: >-
              dotnet format whitespace $(solution)
              --verify-no-changes
              --no-restore
              --exclude backend.dal/Migrations
            displayName: Format

          - script: dotnet build $(solution) -c $(buildConfiguration) --no-restore
            displayName: Build

          - script: >-
              dotnet test $(solution)
              -c $(buildConfiguration)
              --no-build
              --collect "XPlat Code Coverage"
              --results-directory $(Agent.TempDirectory)/testresults
            displayName: Tests

          - task: PublishCodeCoverageResults@2
            displayName: Coverage
            inputs:
              summaryFileLocation: $(Agent.TempDirectory)/testresults/**/coverage.cobertura.xml
              failIfCoverageEmpty: false

          - task: DotNetCoreCLI@2
            displayName: Publish
            inputs:
              command: publish
              publishWebProjects: false
              projects: $(apiProject)
              arguments: -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/api
              zipAfterPublish: true
              modifyOutputPath: false

          - task: PublishPipelineArtifact@1
            displayName: Artifact api
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)
              artifact: api

  - stage: Deploy
    dependsOn: CI
    condition: >-
      and(
        succeeded(),
        eq(${{ parameters.deploy }}, true),
        ne(variables['Build.Reason'], 'PullRequest'),
        eq(variables['Build.SourceBranch'], 'refs/heads/prod')
      )
    jobs:
      - job: deploy
        steps:
          - download: current
            artifact: api

          - task: AzureWebApp@1
            displayName: App Service
            inputs:
              azureSubscription: $(azureServiceConnection)
              appType: webAppLinux
              appName: $(azureWebAppName)
              package: $(Pipeline.Workspace)/api/api.zip
              deploymentMethod: auto
